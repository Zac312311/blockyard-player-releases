name: Publish Player release
on:
  workflow_dispatch:
    inputs:
      artifacts:
        description: JSON object of platform names to short-lived GitHub artifact URLs
        required: true
      version:
        description: Player version to publish (for example 0.4.1)
        required: false
        default: '0.4.1'
      notes:
        description: Release notes
        required: false
        default: ''
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Mask temporary download addresses
        run: |
          node -e 'const fs=require("fs"),e=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH));for(const value of Object.values(JSON.parse(e.inputs.artifacts)))console.log("::add-mask::"+value);'
      - name: Download build artifacts
        run: |
          node <<'JS'
          const fs=require('fs'),{spawnSync}=require('child_process');
          const inputs=JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH)).inputs;
          const data=JSON.parse(inputs.artifacts);
          fs.mkdirSync('packages',{recursive:true});
          for(const platform of ['Windows','macOS','Linux']){
            const url=new URL(data[platform]);if(url.protocol!=='https:'||!url.hostname.endsWith('.blob.core.windows.net'))throw Error('Expected a GitHub artifact URL');
            let r=spawnSync('curl',['--fail','--silent','--show-error','--max-time','300',url.href,'-o',platform+'.zip'],{stdio:'inherit'});if(r.status)process.exit(r.status);
            r=spawnSync('unzip',['-q',platform+'.zip','-d','packages/'+platform],{stdio:'inherit'});if(r.status)process.exit(r.status);
          }
          JS
      - name: Publish installers and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          printf '%s\n' "${NOTES:-Blockyard Player $VERSION.}" > notes.md
          gh release view v$VERSION || gh release create v$VERSION --draft --title "Blockyard Player $VERSION" --notes-file notes.md
          mapfile -d '' files < <(find packages -type f -name 'BlockyardPlayer*' -print0)
          python - <<'PY'
          import hashlib,pathlib
          files=sorted(pathlib.Path('packages').rglob('BlockyardPlayer*'))
          pathlib.Path('SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in files if p.is_file()))
          PY
          gh release upload v$VERSION "${files[@]}" SHA256SUMS.txt --clobber
          gh release edit v$VERSION --draft=false --latest=true
